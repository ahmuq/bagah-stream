name: Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: ver
        run: |
          git fetch --tags --force
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag manual (minor/major): pakai versi tag apa adanya.
            name="${GITHUB_REF#refs/tags/v}"
          else
            latest=$(git tag -l 'v*' | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              name="1.0.0"
            else
              base="${latest#v}"
              IFS=. read -r MA MI PA <<< "$base"
              PA=$((PA + 1))
              name="$MA.$MI.$PA"
            fi
          fi
          code=$(awk -F. '{print $1*10000 + $2*100 + $3}' <<< "$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Next version: $name (code $code)"

      - name: Decode keystore (optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret, release will use debug signing."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Prepare APK
        run: |
          mkdir -p out
          src=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$src" "out/bagah-streaming-v${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: out/*.apk
